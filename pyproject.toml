[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pb210fit"
version = "0.1.0"
description = "First-principles multi-nuclide spectral deconvolution engine for Liquid Scintillation Spectrometry (Pb-210, Bi-210, Po-210)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jeongsoo Kang" }
]
keywords = [
    "liquid-scintillation",
    "spectrometry",
    "radiochemistry",
    "nuclear-physics",
    "deconvolution",
    "lead-210",
    "bismuth-210",
    "polonium-210"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
report = [
    "matplotlib>=3.5.0",
    "openpyxl>=3.0.0",
    "xlsxwriter>=3.0.0",
]

[project.urls]
"Research Report" = "https://amatoroi-vlt.github.io/reports/Research/report-first-principles-chain.html"

[tool.setuptools.packages.find]
where = ["."]
include = ["pb210fit*"]

[tool.setuptools.package-data]
pb210fit = ["data/**/*", "data/**/**/*"]
